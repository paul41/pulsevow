services:

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulsevow-frontend
    restart: unless-stopped
    networks:
      - pulsevow-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulsevow-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    networks:
      - pulsevow-network

  nginx:
    image: nginx:alpine
    container_name: pulsevow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - pulsevow-network

networks:
  pulsevow-network:
    driver: bridge