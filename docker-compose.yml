services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulsevow-frontend
    restart: unless-stopped
    networks:
      - pulsevow-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulsevow-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      - postgres
      - redis
    networks:
      - pulsevow-network

  postgres:
    image: postgres:16-alpine
    container_name: pulsevow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsevow
      POSTGRES_USER: pulsevow
      POSTGRES_PASSWORD: bQhp953re
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulsevow-network

  redis:
    image: redis:7-alpine
    container_name: pulsevow-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - pulsevow-network

  nginx:
    image: nginx:alpine
    container_name: pulsevow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - pulsevow-network

networks:
  pulsevow-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: