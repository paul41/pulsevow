events {}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:5000;
    }

    # --------------------------------------------------
    # HTTP — ACME challenge + redirect to HTTPS
    # --------------------------------------------------

    server {
        listen 80;
        server_name pulsevow.com www.pulsevow.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://pulsevow.com$request_uri;
        }
    }

    # API HTTP — ACME challenge + redirect to HTTPS
    server {
        listen 80;
        server_name api.pulsevow.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://api.pulsevow.com$request_uri;
        }
    }

    # --------------------------------------------------
    # Frontend HTTPS
    # --------------------------------------------------

    server {
        listen 443 ssl;
        server_name pulsevow.com www.pulsevow.com;

        ssl_certificate /etc/letsencrypt/live/pulsevow.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pulsevow.com/privkey.pem;

        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --------------------------------------------------
    # Backend API HTTPS
    # --------------------------------------------------

    server {
        listen 443 ssl;
        server_name api.pulsevow.com;

        ssl_certificate /etc/letsencrypt/live/pulsevow.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pulsevow.com/privkey.pem;

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Useful for long-running API requests
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}