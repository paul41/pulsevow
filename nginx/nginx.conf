events {}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:5000;
    }

    # Frontend
    server {

        listen 443;

        server_name pulsevow.com www.pulsevow.com;

        ssl_certificate /etc/letsencrypt/live/pulsevow.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pulsevow.com/privkey.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {

            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API
    server {

        listen 80;

        server_name pulsevow.com www.pulsevow.com api.pulsevow.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {

            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}